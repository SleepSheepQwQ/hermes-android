plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nousresearch.hermesandroid'
    compileSdk 35

    defaultConfig {
        applicationId "com.nousresearch.hermesandroid"
        minSdk 24          // Termux bootstrap 要求 Android 7+
        targetSdk 28       // 关键：<=28 才有 untrusted_app_27 的 execve 豁免（W^X）。
                           // 提到 >=29 会永久失去在 files/ 执行二进制的能力（SELinux neverallow）。
                           // 代价：无法上架 Google Play。详见 docs/05-architecture-decisions.md
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 签名：密钥绝不进仓库。CI 从 Secret 解码 keystore 到 $RUNNER_TEMP，
    // 并把路径与口令通过环境变量传入（见 docs/11-cicd-constraints.md）。
    signingConfigs {
        release {
            def ksPath = System.getenv("HERMES_KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("HERMES_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HERMES_KEY_ALIAS") ?: "hermes"
                keyPassword System.getenv("HERMES_KEY_PASSWORD")
                // v1 必需：老设备可能只认 v1 签名
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 有正式 keystore 用 release 签名，否则回退 debug（便于本地/CI 首次跑通）
            signingConfig (System.getenv("HERMES_KEYSTORE_PATH") != null
                    ? signingConfigs.release : signingConfigs.debug)
        }
        debug {
            // 保留调试信息
        }
    }

    // 关键：把 lib*.so 原样打包，不做二次压缩也不 strip，
    // 否则 bootstrap zip 会被破坏（termux-app 的做法）。
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ["**/*.so"]
        }
        resources {
            excludes += ["META-INF/*"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 打包后的 bootstrap zip 位于 jniLibs/arm64-v8a/libtermux-bootstrap.so，
    // 由 build-apk.yml 在构建前拷贝进来；本目录不放二进制。
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'          // NotificationCompat（SetupService 用）
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
}
