name: build-payload

# 在 CI 里用 QEMU 模拟 aarch64，于真实 Termux 环境中安装 Hermes 的 [termux] 依赖，
# 产出可直接打进 APK 的 venv（已修剪）。
#
# 做法来源（实战验证过的先例）：
#   camillanapoles/termux-wheel-forge/.github/workflows/build-wheel.yml
#   → docker/setup-qemu-action@v3 (platforms: arm64)
#   → docker run --platform linux/arm64 termux/termux-docker:latest
#
# 依据 docs/04-bootstrap-findings.md：原生扩展必须在 bionic 上编译，
# ubuntu 的 manylinux wheel 在 Android 上 ABI 不兼容。

on:
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: "Hermes 源码 ref（tag/commit/branch）"
        required: true
        default: "main"
      extra:
        description: "pip extras（默认 termux）"
        required: false
        default: "termux"

permissions:
  contents: write

jobs:
  payload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # ubuntu-latest 仅 ~14GB 可用磁盘；bootstrap 解压 616MB + payload 512MB
        # + Docker 镜像 + 中间产物极易爆盘。详见 docs/11-cicd-constraints.md
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          swap-storage: true

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Pull Termux container
        run: docker pull termux/termux-docker:latest

      - name: Stage build inputs
        run: |
          set -eux
          mkdir -p buildin dist
          cp scripts/trim_source.sh scripts/trim_venv.sh buildin/
          cp scripts/build-payload-in-termux.sh buildin/
          cp patches/*.patch buildin/
          ls -l buildin/

      - name: Build Hermes venv inside Termux (QEMU)
        run: |
          set -eux
          docker run --platform linux/arm64 --name hermes-build \
            -v "$PWD/buildin:/work:ro" \
            -v "$PWD/dist:/data/data/com.termux/files/home/dist" \
            -e HERMES_REF='${{ inputs.hermes_ref }}' \
            -e HERMES_EXTRA='${{ inputs.extra }}' \
            termux/termux-docker:latest \
            bash /work/build-payload-in-termux.sh
          ls -lh dist/ || true

      - name: Show artifact sizes
        run: |
          set -eux
          du -sh dist/* || true

      - name: Smoke test payload
        run: |
          set -eux
          bash scripts/smoke_test.sh payload dist/*.tar.zst

      - name: Upload payload (short-lived, job handoff only)
        # 注意：GitHub Actions Artifacts 在 Free 计划仅 500MB 总配额，
        # payload ~300MB 会迅速吃满，故 retention 只留 1 天，仅用于 job 间传递。
        # 长期产物一律走 Release（单文件上限 2GiB，无总量配额）。
        uses: actions/upload-artifact@v4
        with:
          name: hermes-payload
          path: dist/*.tar.zst
          retention-days: 1

      - name: Publish payload to Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          TAG="payload-$(date -u +%Y%m%d)-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "payload $TAG" \
            --notes "Hermes payload（源码+venv+tools），ref=${{ inputs.hermes_ref }}，extras=${{ inputs.extra }}" \
            dist/*.tar.zst || \
            gh release upload "$TAG" dist/*.tar.zst --repo "${{ github.repository }}" --clobber
          sha256sum dist/*.tar.zst | tee dist/SHA256SUMS
