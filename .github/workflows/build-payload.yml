name: build-payload

# 在**原生 aarch64 runner** 上构建 Hermes 的 [termux] 依赖，产出 sealed payload。
#
# 为什么用 ubuntu-24.04-arm 而不是 ubuntu-latest + QEMU：
#   1. arm64 hosted runner 对 public 仓库免费（GitHub 2025-01 公告）。
#   2. 原生 arm64 → 不需要 QEMU 模拟。QEMU 用户态在 GHA 上非确定性崩溃
#      （docker/setup-qemu-action#188），且慢 5~20 倍。
#   3. termux-docker 官方与社区案例都在原生架构上跑，跨架构 QEMU 无成功先例。
#   依据：docs/14-cicd-arm64-runner.md
#
# 为什么仍用 termux-docker 容器：
#   bootstrap 的二进制是 bionic（aarch64-linux-android），需要 /system/bin/linker64
#   与 aosp-libs。termux-docker 镜像已封装好这套（= bootstrap + aosp-libs），
#   自己用 proot 搭要额外处理 linker，风险更高。
#
# 容器调用要点（来源：termux-docker README + issue #62/#64）：
#   - 用**手动 docker run**（不是 jobs.<container>），ENTRYPOINT 不会被覆盖，
#     /entrypoint.sh 会自动把 root 降权到 system(uid 1000)，pkg 才不报错。
#   - ARM 容器需要 --security-opt seccomp=unconfined（personality() 系统调用）。
#   - 容器内 uid(1000) != runner uid，挂载目录必须 a+rwX。
#   - entrypoint.sh 用 `su ... -i` 清空环境后只注入固定变量，
#     所以**自定义参数必须走位置参数**，不能靠 -e 环境变量。

on:
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: "Hermes 源码 ref（tag/commit/branch）"
        required: true
        default: "main"
      extra:
        description: "pip extras（默认 termux）"
        required: false
        default: "termux"

permissions:
  contents: write

jobs:
  payload:
    # 原生 arm64（public 仓库免费）。不能用 ubuntu-latest：那是 x86_64，
    # 需 QEMU 模拟 aarch64，慢且不稳定。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Show runner info
        run: |
          set -eux
          uname -m
          nproc
          df -h / | tail -1

      - name: Free disk space
        # 非致命：arm64 镜像的磁盘布局可能与 x86 不同，失败不应中断构建
        continue-on-error: true
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          swap-storage: true

      - name: Pull Termux container (native aarch64, no QEMU)
        run: |
          set -eux
          docker pull --platform linux/arm64 termux/termux-docker:aarch64
          docker image inspect termux/termux-docker:aarch64 --format '{{.Architecture}} {{.Os}}'

      - name: Stage build inputs
        run: |
          set -eux
          mkdir -p buildin dist
          cp scripts/trim_source.sh scripts/trim_venv.sh buildin/
          cp scripts/fix_editable.sh buildin/
          cp scripts/fix_python_paths.sh buildin/
          cp scripts/build-payload-in-termux.sh buildin/
          cp patches/*.patch buildin/
          # 容器内是非 root 用户（uid 1000），与 runner uid 不同；
          # 挂载目录必须 world-writable，否则容器写不进去
          chmod -R a+rwX buildin dist
          ls -l buildin/

      - name: Build Hermes payload inside Termux container
        run: |
          set -eux
          # 关键参数说明：
          #   --security-opt seccomp=unconfined  ARM 容器必需（personality() syscall）
          #   --platform linux/arm64             防镜像 manifest 误标（已知问题）
          #   位置参数 main/termux               会被 entrypoint.sh 透传给脚本
          #                                      （-e 环境变量会被 su -i 清掉）
          docker run --name hermes-build \
            --platform linux/arm64 \
            --security-opt seccomp=unconfined \
            -v "$PWD/buildin:/work:ro" \
            -v "$PWD/dist:/data/data/com.termux/files/home/out" \
            termux/termux-docker:aarch64 \
            bash /work/build-payload-in-termux.sh '${{ inputs.hermes_ref }}' '${{ inputs.extra }}'
          ls -lh dist/ || true

      - name: Fallback docker cp (in case bind mount failed)
        if: always()
        run: |
          set -eux
          if ! ls dist/*.tar.* >/dev/null 2>&1; then
            echo "挂载目录无产物，尝试 docker cp"
            docker cp "hermes-build:/data/data/com.termux/files/home/out/." dist/ || true
          fi
          docker rm -f hermes-build >/dev/null 2>&1 || true
          ls -lh dist/ || true

      - name: Normalize payload name
        run: |
          set -eux
          cd dist
          # 统一成 build-apk.yml 期望的名字
          if [ -f hermes-payload.tar.zst ]; then
            :
          elif [ -f hermes-payload.tar.gz ]; then
            :
          else
            f=$(ls *.tar.* | head -1)
            cp "$f" hermes-payload.${f##*.} 2>/dev/null || cp "$f" hermes-payload.tar.gz
          fi
          ls -lh

      - name: Show artifact sizes
        run: |
          set -eux
          du -sh dist/* || true

      - name: Smoke test payload
        run: |
          set -eux
          # 注意：glob 无匹配时字面量会被传给 [ -f ]，返回 1 会让 set -e 直接退出。
          # 用 shopt nullglob 让无匹配的 glob 展开为空。
          shopt -s nullglob
          files=(dist/*.tar.zst dist/*.tar.gz)
          shopt -u nullglob
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有找到 payload 产物"; exit 1
          fi
          for f in "${files[@]}"; do
            bash scripts/smoke_test.sh payload "$f"
          done

      - name: Upload payload (short-lived, job handoff only)
        # 注意：GitHub Actions Artifacts 在 Free 计划仅 500MB 总配额，
        # payload ~300MB 会迅速吃满，故 retention 只留 1 天，仅用于 job 间传递。
        # 长期产物一律走 Release（单文件上限 2GiB，无总量配额）。
        uses: actions/upload-artifact@v4
        with:
          name: hermes-payload
          path: |
            dist/*.tar.zst
            dist/*.tar.gz
          retention-days: 1

      - name: Publish payload to Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          TAG="payload-$(date -u +%Y%m%d)-${{ github.run_number }}"
          FILES=$(ls dist/*.tar.zst dist/*.tar.gz 2>/dev/null || true)
          [ -n "$FILES" ] || { echo "无产物可发布"; exit 1; }
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "payload $TAG" \
            --notes "Hermes sealed payload（源码+venv+tools），ref=${{ inputs.hermes_ref }}，extras=${{ inputs.extra }}" \
            $FILES || \
            gh release upload "$TAG" $FILES --repo "${{ github.repository }}" --clobber
