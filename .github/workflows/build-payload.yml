name: build-payload

# 在 CI 里用 QEMU 模拟 aarch64，于真实 Termux 环境中安装 Hermes 的 [termux] 依赖，
# 产出可直接打进 APK 的 venv（已修剪）。
#
# 做法来源（实战验证过的先例）：
#   camillanapoles/termux-wheel-forge/.github/workflows/build-wheel.yml
#   → docker/setup-qemu-action@v3 (platforms: arm64)
#   → docker run --platform linux/arm64 termux/termux-docker:latest
#
# 依据 docs/04-bootstrap-findings.md：原生扩展必须在 bionic 上编译，
# ubuntu 的 manylinux wheel 在 Android 上 ABI 不兼容。

on:
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: "Hermes 源码 ref（tag/commit/branch）"
        required: true
        default: "main"
      extra:
        description: "pip extras（默认 termux）"
        required: false
        default: "termux"

permissions:
  contents: write

jobs:
  payload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # ubuntu-latest 仅 ~14GB 可用磁盘；bootstrap 解压 616MB + payload 512MB
        # + Docker 镜像 + 中间产物极易爆盘。详见 docs/11-cicd-constraints.md
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          swap-storage: true

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Pull Termux container
        run: docker pull termux/termux-docker:latest

      - name: Stage build inputs
        run: |
          set -eux
          mkdir -p buildin dist
          cp scripts/trim_source.sh scripts/trim_venv.sh buildin/
          cp scripts/fix_editable.sh buildin/
          cp scripts/fix_python_paths.sh buildin/
          cp scripts/build-payload-in-termux.sh buildin/
          cp patches/*.patch buildin/
          # 容器内是非 root 用户，uid ≠ runner；挂载目录必须 world-writable，
          # 否则容器写不进去（来源：termux-wheel-forge 实测注释）
          chmod -R a+rwX buildin dist
          ls -l buildin/

      - name: Build Hermes venv inside Termux (QEMU)
        run: |
          set -eux
          # 容器内 HOME=/data/data/com.termux/files/home
          # 脚本把产物写到 $HOME/out，这里把它挂到宿主 dist/
          docker run --platform linux/arm64 --name hermes-build \
            -v "$PWD/buildin:/work:ro" \
            -v "$PWD/dist:/data/data/com.termux/files/home/out" \
            -e HERMES_REF='${{ inputs.hermes_ref }}' \
            -e HERMES_EXTRA='${{ inputs.extra }}' \
            termux/termux-docker:latest \
            bash /work/build-payload-in-termux.sh
          ls -lh dist/ || true

      - name: Fallback docker cp (in case bind mount failed)
        if: always()
        run: |
          set -eux
          if ! ls dist/*.tar.* >/dev/null 2>&1; then
            echo "挂载目录无产物，尝试 docker cp"
            docker cp "hermes-build:/data/data/com.termux/files/home/out/." dist/ || true
          fi
          docker rm -f hermes-build >/dev/null 2>&1 || true
          ls -lh dist/ || true

      - name: Normalize payload name
        run: |
          set -eux
          cd dist
          # 统一成 build-apk.yml 期望的名字
          if [ -f hermes-payload.tar.zst ]; then
            :
          elif [ -f hermes-payload.tar.gz ]; then
            :
          else
            f=$(ls *.tar.* | head -1)
            cp "$f" hermes-payload.${f##*.} 2>/dev/null || cp "$f" hermes-payload.tar.gz
          fi
          ls -lh

      - name: Show artifact sizes
        run: |
          set -eux
          du -sh dist/* || true

      - name: Smoke test payload
        run: |
          set -eux
          for f in dist/*.tar.zst dist/*.tar.gz; do
            [ -f "$f" ] && bash scripts/smoke_test.sh payload "$f"
          done

      - name: Upload payload (short-lived, job handoff only)
        # 注意：GitHub Actions Artifacts 在 Free 计划仅 500MB 总配额，
        # payload ~300MB 会迅速吃满，故 retention 只留 1 天，仅用于 job 间传递。
        # 长期产物一律走 Release（单文件上限 2GiB，无总量配额）。
        uses: actions/upload-artifact@v4
        with:
          name: hermes-payload
          path: |
            dist/*.tar.zst
            dist/*.tar.gz
          retention-days: 1

      - name: Publish payload to Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          TAG="payload-$(date -u +%Y%m%d)-${{ github.run_number }}"
          FILES=$(ls dist/*.tar.zst dist/*.tar.gz 2>/dev/null || true)
          [ -n "$FILES" ] || { echo "无产物可发布"; exit 1; }
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "payload $TAG" \
            --notes "Hermes sealed payload（源码+venv+tools），ref=${{ inputs.hermes_ref }}，extras=${{ inputs.extra }}" \
            $FILES || \
            gh release upload "$TAG" $FILES --repo "${{ github.repository }}" --clobber
