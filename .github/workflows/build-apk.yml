name: build-apk

# 把 bootstrap + Hermes 载荷打进 APK。
# 依赖：build-bootstrap.yml 产出的 bootstrap-aarch64.zip
# 说明：本机不构建；全部在 GitHub Actions 上完成。

on:
  workflow_dispatch:
    inputs:
      bootstrap_tag:
        description: "bootstrap release tag（留空则自动取最新 bootstrap-*）"
        required: false
        default: ""
  workflow_run:
    workflows: ["build-bootstrap"]
    types: [completed]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve bootstrap artifact
        id: boot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          TAG="${{ inputs.bootstrap_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "${{ github.repository }}" --limit 50 \
                  | awk '$1 ~ /^bootstrap-/ {print $1; exit}')
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern 'bootstrap-aarch64.zip' --dir bootstrap
          ls -lh bootstrap/

      - name: Place bootstrap into jniLibs
        run: |
          set -eux
          mkdir -p app/src/main/jniLibs/arm64-v8a
          # 伪装成 .so：Android 安装时会把 lib/<abi>/*.so 原样解压到 nativeLibraryDir，
          # 规避 assets 压缩与 execve 限制（termux-app 的做法）。
          cp bootstrap/bootstrap-aarch64.zip app/src/main/jniLibs/arm64-v8a/libtermux-bootstrap.so
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          set -eux
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
