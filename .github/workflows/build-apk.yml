name: build-apk

# 把 bootstrap + Hermes 载荷打进 APK。
# 依赖 Release 产物：
#   bootstrap-*  → bootstrap-aarch64.zip
#   payload-*    → hermes-payload.tar.zst
#
# 说明：本机不构建；编译全部在 GitHub Actions 上完成。

on:
  workflow_dispatch:
    inputs:
      bootstrap_tag:
        description: "bootstrap release tag（留空自动取最新 bootstrap-*）"
        required: false
        default: ""
      payload_tag:
        description: "payload release tag（留空自动取最新 payload-*）"
        required: false
        default: ""
      build_type:
        description: "debug 或 release"
        required: false
        default: "debug"
  workflow_run:
    workflows: ["build-bootstrap", "build-payload"]
    types: [completed]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    # 守卫：workflow_run 触发时必须上游成功才继续，否则会拉到旧的 Release 产物
    # （types: [completed] 包含 failure，不加守卫会在上游失败时也跑）
    if: |
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # ubuntu-latest 仅 ~14GB 可用；两个载荷解压后合计 >1GB，加上 Android SDK
        # 与 Gradle 缓存极易爆盘。详见 docs/11-cicd-constraints.md
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          swap-storage: true

      - name: Resolve release tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          BTAG="${{ inputs.bootstrap_tag }}"
          PTAG="${{ inputs.payload_tag }}"
          # 注意：gh release list 默认是 tab 分隔的表格，**第一列是描述**、
          # 第二列才是 tag。用 --json 取 tagName 最稳（不受列宽/描述影响）。
          if [ -z "$BTAG" ]; then
            BTAG=$(gh release list --repo "${{ github.repository }}" --limit 100 \
                   --json tagName --jq '[.[] | select(.tagName | startswith("bootstrap-"))][0].tagName // ""')
          fi
          if [ -z "$PTAG" ]; then
            PTAG=$(gh release list --repo "${{ github.repository }}" --limit 100 \
                   --json tagName --jq '[.[] | select(.tagName | startswith("payload-"))][0].tagName // ""')
          fi
          # 防御：找不到 tag 就明确失败，不要让后续 gh release download "" 报出难懂的错
          [ -n "$BTAG" ] || { echo "!! 找不到任何 bootstrap-* Release"; exit 1; }
          [ -n "$PTAG" ] || { echo "!! 找不到任何 payload-* Release（需先跑 build-payload）"; exit 1; }
          echo "bootstrap_tag=$BTAG" >> "$GITHUB_OUTPUT"
          echo "payload_tag=$PTAG"   >> "$GITHUB_OUTPUT"
          echo "使用 bootstrap=$BTAG payload=$PTAG"

      - name: Download bootstrap and payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mkdir -p artifacts
          gh release download "${{ steps.tags.outputs.bootstrap_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern 'bootstrap-aarch64.zip*' --dir artifacts
          gh release download "${{ steps.tags.outputs.payload_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.tar.zst' --dir artifacts || \
          gh release download "${{ steps.tags.outputs.payload_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.tar.gz' --dir artifacts
          ls -lh artifacts/

      - name: Smoke test downloaded artifacts
        run: |
          set -eux
          bash scripts/smoke_test.sh bootstrap artifacts/bootstrap-aarch64.zip || true
          for f in artifacts/*.tar.zst artifacts/*.tar.gz; do
            [ -f "$f" ] && bash scripts/smoke_test.sh payload "$f" || true
          done

      - name: Place payloads into jniLibs
        run: |
          set -eux
          JNI=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI"

          # 伪装成 .so：Android 安装时会把 lib/<abi>/*.so 原样解压到
          # nativeLibraryDir（只读），从而规避 assets 压缩与 W^X exec 限制。
          [ -f artifacts/bootstrap-aarch64.zip ] || { echo "缺少 bootstrap"; exit 1; }
          cp artifacts/bootstrap-aarch64.zip "$JNI/libtermux-bootstrap.so"

          # payload：只取**一个**（同时存在 .tar.zst 与 .tar.gz 时，
          # 循环会让后者覆盖前者，结果不确定）
          PAYLOAD=""
          for c in artifacts/*.tar.zst artifacts/*.tar.gz; do
            [ -f "$c" ] && { PAYLOAD="$c"; break; }
          done
          [ -n "$PAYLOAD" ] || { echo "缺少 payload"; exit 1; }
          cp "$PAYLOAD" "$JNI/libhermes-payload.so"

          # 断言：两个载荷都必须非空且达到最小体积，否则会构建出
          # 「能装上但跑不起来」的空壳 APK
          bs=$(stat -c%s "$JNI/libtermux-bootstrap.so")
          pl=$(stat -c%s "$JNI/libhermes-payload.so")
          echo "bootstrap=$bs bytes, payload=$pl bytes"
          [ "$bs" -gt 50000000 ] || { echo "bootstrap 体积异常（$bs）"; exit 1; }
          [ "$pl" -gt 20000000 ] || { echo "payload 体积异常（$pl）"; exit 1; }

          # 字节级完整性（审查 A1）：伪 .so 必须是**未被动过的原始压缩包**。
          # AGP 的 strip/对齐若误处理这两个文件，体积断言查不出来，但设备侧解压必崩。
          python3 - <<'PY'
          import zipfile, sys
          p = "app/src/main/jniLibs/arm64-v8a/libtermux-bootstrap.so"
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  print("bootstrap zip 损坏于:", bad); sys.exit(1)
          print("OK: bootstrap zip 结构完整")
          PY
          # 字节级完整性（审查 A1）：伪装 .so 必须与 Release 原始 zip **逐字节相同**。
          # 先校验下载的 zip 自身 sha256，再比对 .so 与 zip 的哈希是否一致
          # （AGP 或任何中间步骤若动过文件，这里就会暴露）。
          (cd artifacts && sha256sum -c bootstrap-aarch64.zip.sha256)
          a=$(sha256sum "$JNI/libtermux-bootstrap.so" | cut -d' ' -f1)
          b=$(sha256sum artifacts/bootstrap-aarch64.zip | cut -d' ' -f1)
          [ "$a" = "$b" ] || { echo "!! 伪装 .so 与原始 zip 不一致（$a vs $b）"; exit 1; }
          echo "OK: 伪装 .so 与原始 bootstrap zip 字节一致"
          ls -lh "$JNI"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 用 wrapper 里声明的版本；无需仓库内提交 gradle-wrapper.jar
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools (apksigner)
        run: |
          set -eux
          # setup-android 不预装 build-tools；apksigner 在其中
          sdkmanager "build-tools;35.0.0" >/dev/null || sdkmanager --list | head -20
          ls "$ANDROID_SDK_ROOT/build-tools/"

      - name: Build APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -eux
          TASK=":app:assembleDebug"
          [ "${BUILD_TYPE:-debug}" = "release" ] && TASK=":app:assembleRelease"

          # 直接用 gradle/actions/setup-gradle 提供的 gradle。
          # 不用仓库内的 gradlew：gradle-wrapper.jar 是二进制、未提交，
          # 而「先跑 gradlew 生成 jar 再用它」的链路脆弱且副作用不可控。
          # setup-gradle 已按 gradle-version 装好对应版本。
          gradle "$TASK" --no-daemon --stacktrace
          find app/build/outputs -name '*.apk' -exec ls -lh {} \;

      - name: Verify APK signature
        run: |
          set -eux
          APK=$(find app/build/outputs -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "未产出 APK"; exit 1; }
          # apksigner 由 Android SDK build-tools 提供
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" || true

      - name: Upload APK (short-lived)
        uses: actions/upload-artifact@v4
        with:
          name: hermes-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 1

      - name: Publish APK to Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          APK=$(find app/build/outputs -name '*.apk' | head -1)
          TAG="apk-$(date -u +%Y%m%d)-${{ github.run_number }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Hermes APK $TAG" \
            --notes "bootstrap=${{ steps.tags.outputs.bootstrap_tag }} payload=${{ steps.tags.outputs.payload_tag }} type=${{ inputs.build_type }}" \
            "$APK" || gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" --clobber
          sha256sum "$APK" | tee SHA256SUMS
